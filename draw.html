<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An endless sheet of paper and a box of crayons. Draw, type, and write a question about Ali: an AI answers in crayon right next to it." />
    <!-- opt in to the page turn between the site and the sketchpad early, before any stylesheet loads (styles/global.css animates it) -->
    <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
    <meta name="theme-color" content="#fbf7ee" />
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1f2b26');
      })();
    </script>
    <title>Sketchpad · Ali Hussain</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- link previews (LinkedIn, WhatsApp, Slack, X): public/og-draw.jpg is a screenshot of the sketchpad -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ali Hussain" />
    <meta property="og:url" content="https://ali-hussain-portfolio.netlify.app/draw" />
    <meta property="og:title" content="Sketchpad · Ali Hussain" />
    <meta property="og:description" content="An endless sheet of paper and a box of crayons. Draw, type, and write a question about Ali: an AI answers in crayon right next to it." />
    <meta property="og:image" content="https://ali-hussain-portfolio.netlify.app/og-draw.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The sketchpad: “What does Ali do?” typed in blue, answered in purple crayon handwriting, with a crayon heart and sun" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/patrick-hand-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/scribble/sketchpad-main.tsx"></script>
  </body>
</html>
