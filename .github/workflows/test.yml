name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # the sketchpad gets practice answers (AI_PRACTICE=1): no keys, and none of the free AI allowance spent
      - run: npm test
        env:
          CI: true
