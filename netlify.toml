[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# POST /api/contact and /api/ask (each function sets its own path)
# every blog post is served by the one blog page (blog.html reads the address)
[[redirects]]
  from = "/blog/*"
  to = "/blog.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # what the sketchpad's AI answers from: its notes and the blog (read at run time by server/ask-material.ts)
  included_files = ["content/ai/**", "content/blog/**"]
