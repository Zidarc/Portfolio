<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ali Hussain's blog: notes on backend, systems and the things he builds." />
    <!-- opt in to the page turn between pages early, before any stylesheet loads (styles/global.css animates it) -->
    <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
    <meta name="theme-color" content="#fbf7ee" />
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1f2b26');
      })();
    </script>
    <title>Blog · Ali Hussain</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- link previews (LinkedIn, WhatsApp, Slack, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ali Hussain" />
    <meta property="og:url" content="https://alihussain.codes/blog" />
    <meta property="og:title" content="Blog · Ali Hussain" />
    <meta property="og:description" content="Ali Hussain's blog: notes on backend, systems and the things he builds." />
    <meta property="og:image" content="https://alihussain.codes/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="“Hello, I am Ali Hussain” written in red crayon next to his photo" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/patrick-hand-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/blog/blog-main.tsx"></script>
  </body>
</html>
